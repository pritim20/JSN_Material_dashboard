<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Report · {{ app_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="app">
  {% include '_header.html' %}

  <main class="wrap">
    <div class="head">
      <div><h2>Report</h2></div>
    </div>

    <section class="panel">
      <div class="tbl-wrap">
        <table class="report-tbl">
          <thead><tr><th>Company</th><th>Material</th><th class="num">Quantity</th></tr></thead>
          <tbody id="report"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
{% include '_modals.html' %}
<script>window.LOW_STOCK = {{ low_stock }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
