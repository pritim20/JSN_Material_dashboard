<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>History · {{ app_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="app">
  {% include '_header.html' %}

  <main class="wrap">
    <div class="head">
      <div><h2>History</h2></div>
    </div>

    <section style="display:grid;gap:16px">
      <div class="tools">
        <div class="seg" role="group" aria-label="Sort history">
          <button type="button" data-s="date" aria-pressed="true">Date wise</button>
          <button type="button" data-s="project" aria-pressed="false">Project wise</button>
          <button type="button" data-s="material" aria-pressed="false">Material wise</button>
        </div>
        <div class="seg" role="group" aria-label="Filter type">
          <button type="button" data-t="all" aria-pressed="true">All</button>
          <button type="button" data-t="in" aria-pressed="false">In</button>
          <button type="button" data-t="out" aria-pressed="false">Out</button>
        </div>
      </div>
      <div class="panel">
        <div class="tbl-wrap">
          <table class="hist-tbl">
            <thead><tr><th>Date</th><th>Type</th><th>Material</th><th class="num">Qty</th><th>By</th><th>Project</th><th>Handed over to</th><th></th></tr></thead>
            <tbody id="hist"></tbody>
          </table>
        </div>
        <div id="histEmpty" class="log-empty" hidden>No movements recorded yet.</div>
      </div>
    </section>
  </main>
</div>
{% include '_modals.html' %}
<script>window.LOW_STOCK = {{ low_stock }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='history.js') }}"></script>
</body>
</html>
