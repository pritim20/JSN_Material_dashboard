<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ app_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<!-- ================= APP ================= -->
<div id="app">
  {% include '_header.html' %}

  <main class="wrap">
    <div class="head">
      <div>
        <h2>Material stock available</h2>
      </div>
    </div>

    <section style="display:grid;gap:16px">
      <div class="tools">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" placeholder="Search material…" aria-label="Search material">
        </div>
      </div>
      <div id="stockPanel" class="panel">
        <div class="tbl-wrap">
          <table class="stock-tbl">
            <thead><tr><th>Material</th><th class="num">Available</th></tr></thead>
            <tbody id="stock"></tbody>
          </table>
        </div>
      </div>
      <div id="stockEmpty" class="empty" hidden>
        <h3>No materials in the store yet</h3>
        <p>Your stock list appears here. Tap <b>Material In</b> to record the first material received.</p>
        <button class="btn btn-in" type="button" id="emptyIn">Add first material</button>
      </div>
    </section>

  </main>
</div>

{% include '_modals.html' %}
<script>window.LOW_STOCK = {{ low_stock }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
