[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # "admin" is a plain word that appears in the page text, so it is not a real secret.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USER"

# Clean page URLs (the API itself is routed from inside netlify/functions/api.mjs)
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/history"
  to = "/history.html"
  status = 200

[[redirects]]
  from = "/report"
  to = "/report.html"
  status = 200

[functions]
  node_bundler = "esbuild"
