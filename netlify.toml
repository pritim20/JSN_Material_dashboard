[build]
  publish = "public"
  functions = "netlify/functions"

# Clean page URLs (the API itself is routed from inside netlify/functions/api.mjs)
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/history"
  to = "/history.html"
  status = 200

[functions]
  node_bundler = "esbuild"
